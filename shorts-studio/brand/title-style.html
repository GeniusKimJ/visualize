<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>강조 제목 스타일</title><style>@import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@700;900&display=swap');
.tc{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:"Black Han Sans","Noto Sans KR",sans-serif}
.tc .bg{position:absolute;inset:0}
.tc .band{position:absolute;left:0;right:0;top:0;padding:200px 50px 0;box-sizing:border-box;text-align:center}
.tc .chip{display:inline-block;background:var(--accent);color:#111;font:900 54px/1 "Noto Sans KR",sans-serif;
  padding:16px 30px 18px;border-radius:14px;letter-spacing:-1px;box-shadow:0 6px 0 rgba(0,0,0,.45);margin-bottom:30px}
.tc .l{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-3px;
  -webkit-text-stroke:18px #111;paint-order:stroke fill;text-shadow:0 12px 0 rgba(0,0,0,.55),0 0 30px rgba(0,0,0,.45)}
.tc .l1{color:#fff}
.tc .l2{color:var(--accent)}
.tc .sig{display:inline-block;margin-top:22px;font:900 36px/1 "Noto Sans KR",sans-serif;color:#fff;letter-spacing:-.5px;
  -webkit-text-stroke:8px #111;paint-order:stroke fill}body{margin:0;background:#0f1115;color:#e9ecf1;font:17px/1.6 "Noto Sans KR",sans-serif}main{max-width:1100px;margin:0 auto;padding:16px}h1{font-size:24px;margin:8px 0}p{color:#9aa3b2}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}figure{margin:0}.scale{width:252px;height:448px;overflow:hidden;border-radius:14px}.scale .tc{transform:scale(.2333);transform-origin:0 0}figcaption{margin-top:8px;color:#9aa3b2;font-size:15px}ul{color:#c9d0db}</style></head><body><main><h1>강조 제목 스타일 — 배경 없는 두 줄</h1><p>배경 띠 없이 태그 1개, 흰 줄 1개, 강조색 줄 1개를 굵은 검은 테두리로 이미지 위에 바로 얹습니다. 분야는 강조색으로 구분합니다. 뒤 배경은 Vrew AI 이미지가 들어갈 자리입니다.</p><div class="grid"><figure><div class="scale"><div class="tc" style="--accent:#FFD62E"><div class="bg" style="background:linear-gradient(180deg,#cfe3f3 0%,#9cc3e0 55%,#e9d9c4 100%)"></div><div class="band"><span class="chip">2026년 대상</span><span class="l l1">짝수년생 건강검진</span><span class="l l2">12월 31일까지</span><span class="sig">오늘의 5060</span></div></div></div><figcaption>건강 · 노랑 강조 — 시범 회차 (검증 완료 문구)</figcaption></figure><figure><div class="scale"><div class="tc" style="--accent:#7CF08A"><div class="bg" style="background:linear-gradient(180deg,#f3e6c4 0%,#d9b46a 60%,#7b5a2a 100%)"></div><div class="band"><span class="chip">디자인 예시</span><span class="l l1">은퇴 후 건보료</span><span class="l l2">이것부터 확인</span><span class="sig">오늘의 5060</span></div></div></div><figcaption>돈 · 연두 강조</figcaption></figure><figure><div class="scale"><div class="tc" style="--accent:#FF8A3D"><div class="bg" style="background:linear-gradient(180deg,#e9e4dc 0%,#bfb2a2 60%,#5e5246 100%)"></div><div class="band"><span class="chip">디자인 예시</span><span class="l l1">이런 문자 오면</span><span class="l l2">절대 누르지 마세요</span><span class="sig">오늘의 5060</span></div></div></div><figcaption>생활·사기예방 · 주황 강조</figcaption></figure><figure><div class="scale"><div class="tc" style="--accent:#7FD8FF"><div class="bg" style="background:linear-gradient(180deg,#ffb35c 0%,#e2603a 50%,#5a2a4a 100%)"></div><div class="band"><span class="chip">디자인 예시</span><span class="l l1">가을 걷기 좋은 길</span><span class="l l2">수도권 3곳</span><span class="sig">오늘의 5060</span></div></div></div><figcaption>여가 · 하늘 강조</figcaption></figure></div><h1 style="margin-top:28px">규칙</h1><ul><li>1줄: 누구 얘기인지 (흰색) · 2줄: 핵심 숫자나 행동 (강조색)</li><li>한 줄 9자 안팎 — 길면 글자가 자동으로 작아지지만 96px 아래로는 안 줄어듭니다</li><li>태그는 6자 이내, 시기·대상 (예: 2026년 대상, 11월부터)</li><li>제목에 쓰는 사실은 팩트체크 통과 문구만</li></ul></main><script>document.fonts.ready.then(function(){document.querySelectorAll(".tc .l").forEach(function(el){var s=150;el.style.fontSize=s+"px";while(el.scrollWidth>980&&s>96){s-=4;el.style.fontSize=s+"px";}});});</script></body></html>
