<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>강조 제목 스타일</title><style>@import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@700;900&display=swap');
.tc{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:"Black Han Sans","Noto Sans KR",sans-serif}
.tc .bg{position:absolute;inset:0}
.tc .band{position:absolute;left:0;right:0;top:0;height:700px;padding:170px 60px 0;box-sizing:border-box;
  background:linear-gradient(180deg,var(--band1),var(--band2));border-bottom:14px solid var(--accent);text-align:center}
.tc .band:before{content:"";position:absolute;left:0;top:0;bottom:0;width:22px;background:var(--accent)}
.tc .chip{display:inline-block;background:var(--accent);color:var(--chipText);font:900 52px/1 "Noto Sans KR",sans-serif;
  padding:16px 30px 18px;border-radius:14px;letter-spacing:-1px;box-shadow:0 6px 0 rgba(0,0,0,.35);margin-bottom:34px}
.tc .l{display:block;white-space:nowrap;line-height:1.08;letter-spacing:-3px;
  text-shadow:0 8px 0 rgba(0,0,0,.45),0 0 2px rgba(0,0,0,.6)}
.tc .l1{color:#fff}
.tc .l2{color:var(--accent)}
.tc .sig{position:absolute;right:46px;bottom:22px;font:700 34px/1 "Noto Sans KR",sans-serif;color:rgba(255,255,255,.75);letter-spacing:-.5px}body{margin:0;background:#0f1115;color:#e9ecf1;font:17px/1.6 "Noto Sans KR",sans-serif}main{max-width:1100px;margin:0 auto;padding:16px}h1{font-size:24px;margin:8px 0}p{color:#9aa3b2}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}figure{margin:0}.scale{width:252px;height:448px;overflow:hidden;border-radius:14px}.scale .tc{transform:scale(.2333);transform-origin:0 0}figcaption{margin-top:8px;color:#9aa3b2;font-size:15px}ul{color:#c9d0db}</style></head><body><main><h1>강조 제목 스타일 — 꽉찬 두 줄</h1><p>위쪽 밴드에 태그 1개, 흰 줄 1개, 강조색 줄 1개. 주제 분야마다 밴드 색이 달라 채널 영상이 한눈에 구분됩니다. 아래 배경은 Vrew AI 이미지가 들어갈 자리입니다.</p><div class="grid"><figure><div class="scale"><div class="tc" style="--band1:#0B1A44;--band2:#17306E;--accent:#FFD62E;--chipText:#0B1A44"><div class="bg" style="background:linear-gradient(180deg,#cfe3f3 0%,#9cc3e0 55%,#e9d9c4 100%)"></div><div class="band"><span class="chip">2026년 대상</span><span class="l l1">짝수년생 건강검진</span><span class="l l2">12월 31일까지</span><span class="sig">오늘의 5060</span></div></div></div><figcaption>시범 회차 (검증 완료 문구)</figcaption></figure><figure><div class="scale"><div class="tc" style="--band1:#06352A;--band2:#0E5541;--accent:#FFC93C;--chipText:#06352A"><div class="bg" style="background:linear-gradient(180deg,#f3e6c4 0%,#d9b46a 60%,#7b5a2a 100%)"></div><div class="band"><span class="chip">디자인 예시</span><span class="l l1">은퇴 후 건보료</span><span class="l l2">이것부터 확인</span><span class="sig">오늘의 5060</span></div></div></div><figcaption>돈 · 초록+금색</figcaption></figure><figure><div class="scale"><div class="tc" style="--band1:#4A0B12;--band2:#7A1420;--accent:#FFE14D;--chipText:#4A0B12"><div class="bg" style="background:linear-gradient(180deg,#e9e4dc 0%,#bfb2a2 60%,#5e5246 100%)"></div><div class="band"><span class="chip">디자인 예시</span><span class="l l1">이런 문자 오면</span><span class="l l2">절대 누르지 마세요</span><span class="sig">오늘의 5060</span></div></div></div><figcaption>생활·사기예방 · 버건디+노랑</figcaption></figure><figure><div class="scale"><div class="tc" style="--band1:#2B1048;--band2:#4A1F7A;--accent:#FFD62E;--chipText:#2B1048"><div class="bg" style="background:linear-gradient(180deg,#ffb35c 0%,#e2603a 50%,#5a2a4a 100%)"></div><div class="band"><span class="chip">디자인 예시</span><span class="l l1">가을 걷기 좋은 길</span><span class="l l2">수도권 3곳</span><span class="sig">오늘의 5060</span></div></div></div><figcaption>여가 · 보라+노랑</figcaption></figure></div><h1 style="margin-top:28px">규칙</h1><ul><li>1줄: 누구 얘기인지 (흰색) · 2줄: 핵심 숫자나 행동 (강조색)</li><li>한 줄 9자 안팎 — 길면 글자가 자동으로 작아지지만 96px 아래로는 안 줄어듭니다</li><li>태그는 6자 이내, 시기·대상 (예: 2026년 대상, 11월부터)</li><li>제목에 쓰는 사실은 팩트체크 통과 문구만</li></ul></main><script>document.fonts.ready.then(function(){document.querySelectorAll(".tc .l").forEach(function(el){var s=150;el.style.fontSize=s+"px";while(el.scrollWidth>960&&s>96){s-=4;el.style.fontSize=s+"px";}});});</script></body></html>
