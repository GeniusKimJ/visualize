<!DOCTYPE html>
<html lang="ko" class="theme-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>떡상 영상 분석 리포트</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html.theme-dark {
      --bg: #0A0A0A; --surface: #141414; --surface-hover: #1C1C1C;
      --border: rgba(255,255,255,0.08);
      --text: #EDEDED; --text-secondary: #888;
      --accent: #3b82f6; --positive: #10b981; --negative: #f43f5e; --warning: #f59e0b;
    }
    html.theme-light {
      --bg: #FAFAF9; --surface: #FFFFFF; --surface-hover: #F5F5F4;
      --border: rgba(0,0,0,0.08);
      --text: #0f172a; --text-secondary: #64748b;
      --accent: #2563eb; --positive: #059669; --negative: #e11d48; --warning: #d97706;
    }
    body {
      font-family: 'Inter', 'Noto Sans KR', -apple-system, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
      -webkit-font-smoothing: antialiased; transition: background .3s, color .3s;
    }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 56px 24px 80px; }
    h1 { font-size: 32px; letter-spacing: -0.03em; }
    h2 { font-size: 20px; margin: 48px 0 16px; letter-spacing: -0.02em; }
    .sub { color: var(--text-secondary); font-size: 14px; margin-top: 6px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 28px; }
    .kpi .v { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
    .kpi .l { color: var(--text-secondary); font-size: 13px; }
    .formula { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
    .rule { display: flex; gap: 12px; align-items: flex-start; }
    .rule .n { flex: none; width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: #fff;
               display: grid; place-items: center; font-weight: 700; font-size: 13px; }
    .rule .t { font-weight: 600; }
    .rule .d { color: var(--text-secondary); font-size: 13px; }
    .warn { border-left: 3px solid var(--warning); padding: 12px 16px; background: var(--surface); border-radius: 8px;
            color: var(--text-secondary); font-size: 14px; margin-bottom: 16px; }
    .tbl { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { padding: 9px 10px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
    thead th { color: var(--text-secondary); font-weight: 500; }
    tbody tr:hover td { background: var(--surface-hover); }
    td a { color: var(--text); text-decoration: none; }
    td a:hover { color: var(--accent); }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .tag.viral { background: color-mix(in srgb, var(--positive) 18%, transparent); color: var(--positive); }
    .tag.control { background: color-mix(in srgb, var(--text-secondary) 18%, transparent); color: var(--text-secondary); }
    .up { color: var(--positive); } .down { color: var(--negative); } .muted { color: var(--text-secondary); }
    .bar { height: 6px; border-radius: 3px; background: var(--border); position: relative; min-width: 80px; }
    .bar > i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--accent); }
    .hooks .card + .card { margin-top: 10px; }
    .hooks .q { font-style: italic; }
    .menu-btn { position: fixed; top: 16px; right: 16px; z-index: 10; width: 40px; height: 40px; border-radius: 10px;
                border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; font-size: 18px; }
    .menu { position: fixed; top: 64px; right: 16px; z-index: 10; display: none; flex-direction: column; min-width: 180px;
            background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .menu.open { display: flex; }
    .menu button { background: none; border: 0; color: var(--text); text-align: left; padding: 11px 16px; cursor: pointer; font: inherit; font-size: 14px; }
    .menu button:hover { background: var(--surface-hover); }
    @media print { .menu-btn, .menu { display: none !important; } body { background: #fff; color: #000; } }
  </style>
</head>
<body>
  <button class="menu-btn" id="menuBtn" aria-label="메뉴">☰</button>
  <div class="menu" id="menu">
    <button id="themeBtn">테마 전환</button>
    <button id="jsonBtn">데이터 JSON 저장</button>
    <button onclick="window.print()">인쇄 / PDF</button>
  </div>

  <div class="wrap">
    <h1>떡상 영상 분석 리포트</h1>
    <p class="sub" id="meta"></p>

    <div class="kpis" id="kpis"></div>

    <h2>공식 카드</h2>
    <div id="formulaWarn"></div>
    <div class="formula" id="formula"></div>

    <h2>떡상군 vs 비교군</h2>
    <div class="card tbl"><table id="compare"></table></div>

    <h2>영상별 상세</h2>
    <div class="card tbl"><table id="videos"></table></div>

    <h2>첫 문장 (훅)</h2>
    <div class="hooks" id="hooks"></div>

    <p class="sub" style="margin-top:40px">반복 구절(복선 대용)은 30초 이상 떨어져 다시 나오는 3단어 구절 수입니다. 실제 복선·회수는 대본을 직접 읽고 확인해야 합니다.</p>
  </div>

  <script>
    var DATA = /*__DATA__*/null;

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    function num(v, d) {
      if (v == null) return '<span class="muted">–</span>';
      if (typeof v === 'boolean') return v ? '✔' : '<span class="muted">·</span>';
      if (typeof v === 'number') return v >= 10000 ? v.toLocaleString() : (d != null ? v.toFixed(d) : String(v));
      return esc(v);
    }
    function pct(v) { return v == null ? '<span class="muted">–</span>' : Math.round(v * 100) + '%'; }
    function lift(it) {
      if (it.lift == null) return '<span class="muted">비교군 없음</span>';
      var p = it.kind === 'bool' ? Math.round(it.lift * 100) + '%p' : Math.round(it.lift * 100) + '%';
      var cls = it.lift > 0 ? 'up' : it.lift < 0 ? 'down' : 'muted';
      return '<span class="' + cls + '">' + (it.lift > 0 ? '+' : '') + p + '</span>';
    }

    function render() {
      var rows = DATA.rows, F = DATA.formula;
      var viral = rows.filter(function (r) { return r.group === 'viral'; });
      document.getElementById('meta').textContent =
        '생성 ' + DATA.generated + ' · 영상 ' + rows.length + '개 (떡상군 ' + F.n_viral + ' / 비교군 ' + F.n_control + ')';

      var best = rows.slice().sort(function (a, b) { return (b.f.views_per_sub || 0) - (a.f.views_per_sub || 0); })[0];
      var avgRatio = viral.length ? viral.reduce(function (s, r) { return s + (r.f.views_per_sub || 0); }, 0) / viral.length : null;
      var totalViews = rows.reduce(function (s, r) { return s + (r.meta.views || 0); }, 0);
      document.getElementById('kpis').innerHTML = [
        ['분석 영상', rows.length + '개'],
        ['총 조회수', totalViews.toLocaleString()],
        ['떡상군 평균 배율', avgRatio == null ? '–' : '×' + avgRatio.toFixed(1)],
        ['최고 배율', best && best.f.views_per_sub != null ? '×' + best.f.views_per_sub : '–']
      ].map(function (k) { return '<div class="card kpi"><div class="v">' + k[1] + '</div><div class="l">' + k[0] + '</div></div>'; }).join('');

      var warn = [];
      if (F.n_control === 0) warn.push('비교군이 없습니다. 아래 항목은 "떡상 영상의 공통점"일 뿐, 떡상 원인이라고 볼 수 없습니다. 같은 채널의 안 터진 영상을 control 로 추가하세요.');
      if (F.n_viral < 5) warn.push('떡상군이 ' + F.n_viral + '개입니다. 공식으로 쓰려면 10개 이상을 권장합니다.');
      document.getElementById('formulaWarn').innerHTML = warn.map(function (w) { return '<div class="warn">' + esc(w) + '</div>'; }).join('');

      var keep = F.items.filter(function (i) { return i.keep; });
      document.getElementById('formula').innerHTML = keep.length ? keep.map(function (it, i) {
        var detail = it.kind === 'bool'
          ? '떡상군 ' + pct(it.viral) + (it.control != null ? ' · 비교군 ' + pct(it.control) : '')
          : '떡상군 평균 ' + num(it.viral) + (it.control != null ? ' · 비교군 ' + num(it.control) : '');
        return '<div class="card rule"><div class="n">' + (i + 1) + '</div><div><div class="t">' + esc(it.label) +
          '</div><div class="d">' + detail + '</div></div></div>';
      }).join('') : '<div class="card muted">조건을 만족하는 항목이 없습니다.</div>';

      document.getElementById('compare').innerHTML =
        '<thead><tr><th>항목</th><th>떡상군</th><th>비교군</th><th>차이</th><th>공식 포함</th></tr></thead><tbody>' +
        F.items.map(function (it) {
          var vv = it.kind === 'bool' ? pct(it.viral) : num(it.viral);
          var cc = it.kind === 'bool' ? pct(it.control) : num(it.control);
          return '<tr><td>' + esc(it.label) + '</td><td>' + vv + '</td><td>' + cc + '</td><td>' + lift(it) + '</td><td>' + (it.keep ? '✔' : '<span class="muted">·</span>') + '</td></tr>';
        }).join('') + '</tbody>';

      var cols = [['조회수', function (r) { return num(r.meta.views); }],
        ['구독자', function (r) { return num(r.meta.subscribers); }],
        ['배율', function (r) { return r.f.views_per_sub == null ? num(null) : '×' + r.f.views_per_sub; }],
        ['좋아요율', function (r) { return r.f.like_rate_pct == null ? num(null) : r.f.like_rate_pct + '%'; }],
        ['댓글', function (r) { return num(r.meta.comments); }],
        ['길이(분)', function (r) { return num(r.f.length_min); }],
        ['챕터', function (r) { return num(r.f.chapters); }],
        ['대가 등장(초)', function (r) { return num(r.f.stakes_at_s); }],
        ['WPM', function (r) { return num(r.f.wpm); }],
        ['2인칭', function (r) { return num(r.f.you_per_100w); }],
        ['숫자/분', function (r) { return num(r.f.numbers_per_min); }],
        ['과학 해설', function (r) { return num(r.f.science_outro); }],
        ['다음 주제 질문', function (r) { return num(r.f.cta_asks_next_topic); }],
        ['시리즈', function (r) { return num(r.f.series); }],
        ['자막', function (r) { return num(r.f.has_transcript); }]];
      var maxRatio = Math.max.apply(null, rows.map(function (r) { return r.f.views_per_sub || 0; }).concat([1]));
      document.getElementById('videos').innerHTML =
        '<thead><tr><th>영상</th>' + cols.map(function (c) { return '<th>' + c[0] + '</th>'; }).join('') + '</tr></thead><tbody>' +
        rows.map(function (r) {
          var w = Math.round((r.f.views_per_sub || 0) / maxRatio * 100);
          return '<tr><td><span class="tag ' + r.group + '">' + (r.group === 'viral' ? '떡상' : '비교') + '</span> ' +
            '<a href="' + esc(r.meta.url) + '" target="_blank" rel="noopener">' + esc((r.meta.title || r.meta.id).slice(0, 48)) + '</a>' +
            '<div class="muted" style="font-size:12px">' + esc(r.meta.channel || '') + ' · ' + esc(r.meta.published || '') + '</div>' +
            '<div class="bar" style="margin-top:6px"><i style="width:' + w + '%"></i></div></td>' +
            cols.map(function (c) { return '<td>' + c[1](r) + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody>';

      document.getElementById('hooks').innerHTML = rows.filter(function (r) { return r.f.hook_first_line; }).map(function (r) {
        return '<div class="card"><div class="q">“' + esc(r.f.hook_first_line) + '”</div><div class="muted" style="font-size:12px;margin-top:6px">' +
          esc(r.meta.title || r.meta.id) + ' · 첫 20초 숫자 ' + (r.f.hook_has_number ? 'O' : 'X') + '</div></div>';
      }).join('') || '<div class="card muted">자막이 있는 영상이 없습니다.</div>';
    }

    var menu = document.getElementById('menu');
    document.getElementById('menuBtn').onclick = function () { menu.classList.toggle('open'); };
    document.getElementById('themeBtn').onclick = function () {
      var h = document.documentElement;
      var dark = h.classList.contains('theme-dark');
      h.classList.toggle('theme-dark', !dark); h.classList.toggle('theme-light', dark);
    };
    document.getElementById('jsonBtn').onclick = function () {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' }));
      a.download = 'viral-analysis.json'; a.click();
    };
    if (DATA) render();
  </script>
</body>
</html>
