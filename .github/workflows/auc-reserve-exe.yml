name: AUC Reserve - Windows exe

on:
  push:
    paths:
      - "auc_reserve/**"
      - ".github/workflows/auc-reserve-exe.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: auc_reserve
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name AUC_Reserve --collect-all playwright gui.py

      - name: Smoke test (windowed exe)
        shell: pwsh
        run: |
          Copy-Item config.json dist\
          # 창 모드 exe라 콘솔 출력이 없으므로 종료 코드와 로그 파일로 확인
          $p = Start-Process dist\AUC_Reserve.exe -ArgumentList "--open","--dry-run" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "dry-run exit $($p.ExitCode)"; exit 1 }
          $p = Start-Process dist\AUC_Reserve.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content dist\logs\*.log -Encoding utf8 | Select-Object -Last 15
          if ($p.ExitCode -ne 0) { Write-Error "selftest exit $($p.ExitCode)"; exit 1 }
          if (-not (Select-String -Path dist\logs\*.log -Pattern "SELFTEST OK" -Quiet)) { Write-Error "selftest log missing"; exit 1 }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out\AUC_Reserve | Out-Null
          Copy-Item dist\AUC_Reserve.exe out\AUC_Reserve\
          Copy-Item config.json, .env.example, README.md, run_weekly.bat, register_task.bat out\AUC_Reserve\

      - uses: actions/upload-artifact@v4
        with:
          name: AUC_Reserve-win64
          path: auc_reserve/out/AUC_Reserve
          retention-days: 30
